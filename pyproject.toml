[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-core-micha"
version = "3.11.0"
authors = [
  { name="Micha Bigler", email="micha.bigler2@gmail.com" },
]
description = "Core utilities and settings for Django Apps"
requires-python = ">=3.10"
dependencies = [
    "Django>=6.1,<7.0",
    "psycopg[binary]",
    "filetype>=1.2,<2.0",
    "django-anymail>=15.2",
    "django-environ",
    "django-cors-headers",
    "djangorestframework",
    "channels",
    "channels_redis",
    "cryptography>=42.0.8",
    "django-allauth[mfa,socialaccount]",
    "redis",
    "whitenoise",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pytest-asyncio>=1.4.0",
]
ai = [
    "openai>=2.54.0",
    "anthropic",
]
extraction = [
    "pypdf>=6.19.0",
    "Pillow>=12.3.0",
]
push = ["pywebpush"]
scripts = ["PyYAML"]
billing = ["stripe>=16", "PyYAML"]
receipts = ["pillow-heif>=1.8.0"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests", "src/django_core_micha/notifications/tests", "src/django_core_micha/onboarding/tests", "src/django_core_micha/messaging/tests", "src/django_core_micha/activity/tests", "src/django_core_micha/assistant/tests", "src/django_core_micha/billing/tests", "src/django_core_micha/receipts/tests"]
asyncio_mode = "auto"

[project.scripts]
generate-env = "django_core_micha.scripts.generate_env:main"
sync-secrets = "django_core_micha.scripts.sync_secrets:main"
run-dev = "django_core_micha.scripts.run_dev:main"
provision-app = "django_core_micha.scripts.provision_app:main"
provision-server-access = "django_core_micha.scripts.provision_server_access:main"

[project.urls]
Homepage = "https://github.com/bigler-webapps/django-core-micha"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

# WICHTIG: Templates / locale-Dateien explizit aufnehmen
[tool.setuptools.package-data]
"django_core_micha" = [
  "templates/**/*.txt",
  "templates/**/*.html",
  "templates/**/*.email",
  "locale/**/django.*",
]
