# Run with the repository's test virtual environment on PATH.
# Install the checkout with .[test,ai,extraction,push,scripts,billing,receipts,reimbursements].
tests:
  backend:
    command: pytest -q -o pythonpath=.
  test-management-launcher:
    command: 'pytest -q -o "pythonpath=src ." tests/test_test_management_launcher.py tests/test_run_dev.py'
  test-management-isolation:
    command: 'pytest -q -o "pythonpath=src ." tests/test_test_management_consumers.py tests/test_test_management_disposal.py tests/test_test_management_synthetic_config.py tests/test_test_management_postgis_proof.py tests/test_test_management_pgvector_proof.py'
  test-management-disposal-proof:
    command: 'pytest -q -o "pythonpath=src ." --dcm-disposal-proof-handles=../.claude/scratch/DCM-DX-19-proof-handles.json tests/test_test_management_disposal_proof.py'
