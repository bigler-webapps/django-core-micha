name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dcm_test
          POSTGRES_USER: dcm_test
          POSTGRES_PASSWORD: dcm_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U dcm_test -d dcm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Install and run tests
        env:
          PYTHONPATH: .
          DCM_TEST_DB_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          pip install -e ".[test,ai,extraction,push,scripts,billing,receipts,reimbursements]"
          pytest -q
